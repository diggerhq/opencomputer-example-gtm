schema = 1

[template]
name = "GTM Engineer"
description = "Research growth opportunities and prepare explicitly approved Notion drafts."
documentation = "https://docs.opencomputer.dev/agents/examples/gtm-engineer"
default_project_name = "gtm-engineer"

[template.first_run]
agent = "gtm-engineer"
prompt = "Run the social opportunity discovery tick for agent-harness-demo."

[template.secrets.EXA_API_KEY]
description = "Exa API key required for the default research workflow."

[template.secrets.APIFY_API_TOKEN]
description = "Apify API token for reviewed Actor tasks."

[template.connections.github]
description = "Optional: read recent pull requests and commits as content topics."
required = false

[template.connections.notion]
description = "Optional: read campaign pages and create explicitly approved drafts."
required = false

[template.connections.searchconsole]
description = "Optional: read your site's search queries and page performance."
required = false
